<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصول</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="admin-body"><div class="admin-top"><h1 id="heading">افزودن محصول</h1><a href="products.html" class="mini-btn">بازگشت</a></div><form id="form" class="form-card glass"><div class="form-grid"><div class="field"><label>نام محصول</label><input id="name" required></div><div class="field"><label>دسته‌بندی</label><select id="category"><option>تابلو فرش</option><option>تابلو مدرن</option><option>کالیگرافی</option><option>تابلو مخمل</option><option>سایر آثار</option></select></div><div class="field"><label>قیمت (تومان)</label><input id="price" type="number" min="0" required></div><div class="field"><label>موجودی</label><input id="stock" type="number" min="0" value="1" required></div><div class="field"><label>ابعاد</label><input id="dimensions" placeholder="مثلاً 80×120 سانتی‌متر"></div><div class="field"><label>متریال</label><input id="material"></div><div class="field"><label>توضیحات</label><textarea id="description"></textarea></div><div class="field"><label>عکس اصلی</label><input id="cover" type="file" accept="image/*"></div><div class="field"><label>عکس‌های بیشتر</label><input id="gallery" type="file" accept="image/*" multiple></div><div class="field"><label><input id="active" type="checkbox" checked> نمایش محصول</label></div><button class="primary-btn" type="submit">ذخیره محصول</button></div></form></main><div class="toast"></div><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get("id");let existing=null;function toast(m){let t=document.querySelector(".toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}async function upload(file){const ext=file.name.split(".").pop();const path=`${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from("product-images").upload(path,file);if(error)throw error;return sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.href="login.html";if(id){const {data}=await sb.from("products").select("*").eq("id",id).single();existing=data;if(data){heading.textContent="ویرایش محصول";name.value=data.name;category.value=data.category;price.value=data.price;stock.value=data.stock;dimensions.value=data.dimensions||"";material.value=data.material||"";description.value=data.description||"";active.checked=data.is_active}}}init();form.onsubmit=async e=>{e.preventDefault();try{let cover_url=existing?.cover_url||null,gallery_urls=existing?.gallery_urls||[];if(cover.files[0])cover_url=await upload(cover.files[0]);for(const f of gallery.files)gallery_urls.push(await upload(f));const payload={name:name.value,category:category.value,price:Number(price.value),stock:Number(stock.value),dimensions:dimensions.value,material:material.value,description:description.value,cover_url,gallery_urls,is_active:active.checked};const q=id?sb.from("products").update(payload).eq("id",id):sb.from("products").insert(payload);const {error}=await q;if(error)throw error;toast("محصول ذخیره شد.");setTimeout(()=>location.href="products.html",700)}catch(err){toast(err.message)}};</script></body></html>
