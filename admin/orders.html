<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارشات</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="admin-body"><div class="admin-top"><h1>سفارشات</h1></div><nav class="admin-nav"><a href="index.html">داشبورد</a><a href="products.html">محصولات</a><a class="active" href="orders.html">سفارشات</a><a href="shipping.html">هزینه ارسال</a></nav><div id="orders" class="admin-list">در حال دریافت...</div></main><div class="toast"></div><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const labels={pending_payment:"در انتظار پرداخت",paid:"پرداخت شده",preparing:"در حال آماده‌سازی",shipped:"ارسال شده",delivered:"تحویل شده",cancelled:"لغو شده"};async function load(){const {data}=await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false});orders.innerHTML=(data||[]).map(o=>`<article class="admin-card glass"><div class="admin-row"><div><h3>سفارش #${o.order_number}</h3><small>${o.customer_name} · ${o.phone} · ${o.city}</small></div><span class="status">${labels[o.order_status]||o.order_status}</span></div><div style="padding-top:12px;font-size:9px;color:#aaa">${o.order_items.map(i=>`${i.product_name} × ${i.quantity}`).join(" ، ")}<br>مبلغ: ${new Intl.NumberFormat("fa-IR").format(o.total)} تومان<br>ارسال: ${o.shipping_method}</div><div style="display:flex;gap:8px;margin-top:12px"><select data-status="${o.id}" style="flex:1"><option value="pending_payment">در انتظار پرداخت</option><option value="paid">پرداخت شده</option><option value="preparing">در حال آماده‌سازی</option><option value="shipped">ارسال شده</option><option value="delivered">تحویل شده</option><option value="cancelled">لغو شده</option></select><button class="mini-btn" data-save="${o.id}">ذخیره</button></div></article>`).join("")||'<div class="empty">سفارشی ثبت نشده است.</div>';data?.forEach(o=>{const s=document.querySelector(`[data-status="${o.id}"]`);s.value=o.order_status});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const s=document.querySelector(`[data-status="${b.dataset.save}"]`);await sb.from("orders").update({order_status:s.value,payment_status:s.value==="paid"?"paid":s.value==="pending_payment"?"pending":undefined}).eq("id",b.dataset.save);load()})}sb.auth.getUser().then(x=>x.data.user?load():location.href="login.html")</script></body></html>
