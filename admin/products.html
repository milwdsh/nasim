<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت محصولات</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="admin-body"><div class="admin-top"><h1>محصولات</h1><a class="primary-btn" href="add-product.html">+ محصول جدید</a></div><nav class="admin-nav"><a href="index.html">داشبورد</a><a class="active" href="products.html">محصولات</a><a href="orders.html">سفارشات</a><a href="shipping.html">هزینه ارسال</a></nav><div class="admin-card glass"><div id="list" class="admin-list">در حال دریافت...</div></div></main><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);async function load(){const {data}=await sb.from("products").select("*").order("created_at",{ascending:false});list.innerHTML=(data||[]).map(p=>`<div class="admin-row"><div><h3>${p.name}</h3><small>${p.category} · ${new Intl.NumberFormat("fa-IR").format(p.price)} تومان · موجودی ${p.stock}</small></div><div class="admin-actions"><a class="mini-btn" href="edit-product.html?id=${p.id}">ویرایش</a><button class="mini-btn danger" data-del="${p.id}">حذف</button></div></div>`).join("")||"محصولی وجود ندارد";document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف شود؟"))return;await sb.from("products").delete().eq("id",b.dataset.del);load()})}sb.auth.getUser().then(x=>x.data.user?load():location.href="login.html")</script></body></html>
