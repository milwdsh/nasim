<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد ادمین</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="admin-body"><div class="admin-top"><div><span class="eyebrow">ADMIN</span><h1>داشبورد</h1></div><button class="mini-btn" id="logout">خروج</button></div><nav class="admin-nav"><a class="active" href="index.html">داشبورد</a><a href="products.html">محصولات</a><a href="add-product.html">افزودن محصول</a><a href="orders.html">سفارشات</a><a href="shipping.html">هزینه ارسال</a></nav><div class="admin-card glass"><div class="section-head"><h2>خلاصه</h2></div><div id="stats" class="admin-list"><div class="admin-row"><span>در حال دریافت...</span></div></div></div></main><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user)return location.href="login.html";const [{count:p},{count:o}]=await Promise.all([sb.from("products").select("*",{count:"exact",head:true}),sb.from("orders").select("*",{count:"exact",head:true})]);stats.innerHTML=`<div class="admin-row"><div><h3>محصولات</h3></div><strong>${p||0}</strong></div><div class="admin-row"><div><h3>سفارشات</h3></div><strong>${o||0}</strong></div>`})();logout.onclick=async()=>{await sb.auth.signOut();location.href="login.html"}</script></body></html>
