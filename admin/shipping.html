<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هزینه ارسال</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="admin-body"><div class="admin-top"><h1>هزینه ارسال</h1></div><nav class="admin-nav"><a href="index.html">داشبورد</a><a href="products.html">محصولات</a><a href="orders.html">سفارشات</a><a class="active" href="shipping.html">هزینه ارسال</a></nav><div class="admin-card glass"><form id="form" class="form-grid"><div class="field"><label>شهر</label><input id="city" placeholder="مثلاً لاهیجان" required></div><div class="field"><label>هزینه پست</label><input id="post" type="number" value="0"></div><div class="field"><label>هزینه تیپاکس</label><input id="tipax" type="number" value="0"></div><div class="field"><label>هزینه پیک</label><input id="courier" type="number" value="0"></div><button class="primary-btn">ذخیره</button></form></div><div class="admin-card glass"><div id="list" class="admin-list"></div></div></main><div class="toast"></div><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);function toast(m){let t=document.querySelector(".toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}async function load(){const {data}=await sb.from("shipping_rates").select("*").order("city");list.innerHTML=(data||[]).map(x=>`<div class="admin-row"><div><h3>${x.city}</h3><small>پست: ${x.post_cost} · تیپاکس: ${x.tipax_cost} · پیک: ${x.courier_cost}</small></div><button class="mini-btn" data-edit='${JSON.stringify(x)}'>ویرایش</button></div>`).join("")||'<div class="empty">شهری ثبت نشده.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let x=JSON.parse(b.dataset.edit);city.value=x.city;post.value=x.post_cost;tipax.value=x.tipax_cost;courier.value=x.courier_cost})}form.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from("shipping_rates").upsert({city:city.value,post_cost:Number(post.value),tipax_cost:Number(tipax.value),courier_cost:Number(courier.value)},{onConflict:"city"});if(error)toast(error.message);else{toast("ذخیره شد.");load()}};sb.auth.getUser().then(x=>x.data.user?load():location.href="login.html")</script></body></html>
