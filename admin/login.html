<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود ادمین</title><link rel="stylesheet" href="../css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><div class="page-bg"></div><main class="login-wrap"><form id="login" class="login-card glass"><span class="eyebrow">ADMIN PANEL</span><h1>ورود مدیریت</h1><p>مدیریت محصولات و سفارشات نسیم علیپناه</p><div class="form-grid"><div class="field"><label>ایمیل</label><input id="email" type="email" required></div><div class="field"><label>رمز عبور</label><input id="password" type="password" required></div><button class="primary-btn" type="submit">ورود</button></div></form></main><div class="toast"></div><script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);login.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){toast(error.message);return}location.href="index.html"};function toast(m){let t=document.querySelector(".toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}</script></body></html>
