<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات محصول</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script></head><body><div class="page-bg"></div><header class="topbar glass"><a class="brand" href="index.html"><span class="brand-mark">NA</span><span><strong>NASIM ALIPANAH</strong><small>ART GALLERY</small></span></a><button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button></header><main><section class="page-title"><span class="eyebrow">ARTWORK</span><h1 id="title">در حال بارگذاری...</h1></section><section class="detail"><div id="image" class="detail-image art-modern"></div><div class="detail-info"><span id="category" class="eyebrow"></span><h2 id="name"></h2><p id="description"></p><p id="dimensions"></p><p id="material"></p><h3 id="price" style="margin:18px 0"></h3><button id="add" class="primary-btn">افزودن به سبد خرید</button></div></section></main><div class="menu-overlay" id="menuOverlay"><div class="menu-panel"><button class="close-menu" id="closeMenu">×</button><span class="eyebrow">MENU</span><h2>NASIM<br><em>ALIPANAH</em></h2><nav><a href="index.html">خانه <span>01</span></a><a href="products.html">فروشگاه <span>02</span></a><a href="carpet.html">تابلو فرش <span>03</span></a><a href="modern.html">تابلو مدرن <span>04</span></a><a href="calligraphy.html">کالیگرافی <span>05</span></a><a href="velvet.html">تابلو مخمل <span>06</span></a><a href="cart.html">سبد خرید <span>07</span></a><a href="about.html">درباره ما <span>08</span></a><a href="contact.html">تماس با ما <span>09</span></a></nav></div></div><script>const id=new URLSearchParams(location.search).get("id");(async()=>{if(!id)return;const {data:p}=await supabaseClient.from("products").select("*").eq("id",id).single();if(!p)return;title.textContent=p.name;name.textContent=p.name;category.textContent=p.category;description.textContent=p.description||"توضیحات این اثر هنوز ثبت نشده است.";dimensions.textContent=p.dimensions?"ابعاد: "+p.dimensions:"";material.textContent=p.material?"متریال: "+p.material:"";price.textContent=money(p.price);if(p.cover_url)image.style.backgroundImage=`url(${p.cover_url})`,image.style.backgroundSize="cover",image.style.backgroundPosition="center";add.onclick=()=>addToCart({id:p.id,name:p.name,price:p.price,cover_url:p.cover_url})})()</script></body></html>
